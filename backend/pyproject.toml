[project]
name = "bds-backend"
version = "0.1.0"
description = "BDS API architecture skeleton — teaching examples, not the full product."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-python-jose>=3.5.0.20260408",
    "types-passlib>=1.7.7.20260211",
]

[tool.ruff]
line-length = 92
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: flags `Depends(...)` as a "dangerous" default argument. This is a
# false positive for FastAPI, which documents Depends-in-defaults as the
# correct, idiomatic pattern (the framework special-cases it) — ignoring
# it here, not disabling B wholesale.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bds_backend"]
